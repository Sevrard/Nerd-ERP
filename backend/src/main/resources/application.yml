spring:
  application:
    name: nerd-erp
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nerd_erp}
    username: ${DATABASE_USERNAME:nerd_erp}
    password: ${DATABASE_PASSWORD:nerd_erp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

nerd:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    enabled: ${GEMINI_ENABLED:true}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key!!}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    invoice-documents: ${INVOICE_DOCUMENTS_DIR:data/invoice-documents}
  mail:
    # Boîte « plateforme » : invitations, mots de passe, et secours si un workspace n'a pas de SMTP.
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    security: ${MAIL_SECURITY:STARTTLS}
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:Nerd ERP}
    # Clé AES (32 octets en Base64) chiffrant les mots de passe SMTP des workspaces en base.
    secrets-key: ${MAIL_SECRETS_KEY:}
    # URL publique du frontend, utilisée dans les liens des e-mails.
    app-base-url: ${APP_BASE_URL:http://localhost:4200}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@nerd.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:Nerd Group}
    tenant-slug: ${BOOTSTRAP_TENANT_SLUG:nerd-group}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
